<h1>Tic-Tac-Toe - Unbeatable ATM</h1>
<br><br>
<div class="board" id="board">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div> <br><br>
<button class="btn btn-primary reset-btn" id="resetBtn">Reset Game</button>
<br><br>
<!-- Vendor JS -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const cells = document.querySelectorAll('.cell');
const resetBtn = document.getElementById('resetBtn');
let gameState = Array(9).fill('');
let gameActive = true;
const player = 'X', ai = 'O';
const winSound = new Audio('assets/sounds/win.mp3');

const winConditions = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

cells.forEach(cell => cell.addEventListener('click', playerMove));
resetBtn.addEventListener('click', resetGame);

function playerMove(e) {
  if(!gameActive) return;
  const index = e.target.getAttribute('data-index');
  if(gameState[index] !== '') return;

  makeMove(index, player);
  if(checkWin(player)) { endGame('You win!'); return; }
  if(isDraw()) { endGame("It's a draw!"); return; }

  setTimeout(() => aiMove(), 200);
}

function makeMove(index, symbol) {
  gameState[index] = symbol;
  cells[index].textContent = symbol;
}

function aiMove() {
  if(!gameActive) return;
  const best = minimax(gameState, ai).index;
  makeMove(best, ai);

  if(checkWin(ai)) { endGame("Computer wins!"); return; }
  if(isDraw()) { endGame("It's a draw!"); return; }
}

function checkWin(sym) {
  return winConditions.some(cond => cond.every(i => gameState[i] === sym));
}

function isDraw() {
  return gameState.every(cell => cell !== '');
}

function endGame(message) {
  gameActive = false;
  winSound.play();
  confetti({particleCount: 150, spread: 70, origin: {y: 0.6}});
  setTimeout(() => alert(message), 100);
}

function minimax(board, playerTurn) {
  const avail = board.map((v,i)=>v===''?i:null).filter(v=>v!==null);
  if(checkWin(ai)) return {score: 10};
  if(checkWin(player)) return {score: -10};
  if(avail.length === 0) return {score: 0};

  const moves = [];
  for(const i of avail) {
    const move = { index: i };
    board[i] = playerTurn;
    const result = minimax(board, playerTurn===ai?player:ai);
    move.score = result.score;
    board[i] = '';
    moves.push(move);
  }

  let bestMove;
  if(playerTurn === ai){
    let bestScore = -Infinity;
    moves.forEach(m => { if(m.score > bestScore){ bestScore = m.score; bestMove = m; }});
  } else {
    let bestScore = Infinity;
    moves.forEach(m => { if(m.score < bestScore){ bestScore = m.score; bestMove = m; }});
  }
  return bestMove;
}

function resetGame() {
  gameState.fill('');
  cells.forEach(c => c.textContent='');
  gameActive = true;
}
</script>
